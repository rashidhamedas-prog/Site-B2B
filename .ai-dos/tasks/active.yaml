      Work as the implementer for TASK-20260810-006. Begin with read-only reproduction and
      exact file claims; expand claims before every edit. Do not patch symptoms, enable
      TypeORM synchronize, mutate production data, deploy, or change the readiness score
      without durable evidence. Preserve public URLs and existing transaction prices.

      BLOG — CONTINUE AND COMPLETE THE AUGUST IMPLEMENTATION
      1. Build a requirement-to-evidence matrix for `seo/weblog.md`, the August blog commits
         (`51a4ad7`, `c8028d6`, `fc0ec7e`), and all `docs/BLOG_*` documents. The current
