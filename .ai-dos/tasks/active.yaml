      BLOG — CONTINUE AND COMPLETE THE AUGUST IMPLEMENTATION
      1. Build a requirement-to-evidence matrix for `seo/weblog.md`, the August blog commits
         (`51a4ad7`, `c8028d6`, `fc0ec7e`), and all `docs/BLOG_*` documents. The current
         BLOG_TEST_REPORT contains planned/manual expectations, not sufficient executed evidence.
      2. Wholesale cover images: fix the listing and detail implementations under
         `apps/web/src/app/(wholesale)/blog/` so `coverImage` is actually rendered, matching
         the retail conditional Image/fallback pattern while retaining wholesale tokens.
         Normalize public media URLs at the storage/API boundary; allow only required image
         origins in Next config, never an arbitrary wildcard.
      3. Retail navigation/design: add `/blog` / `وبلاگ` to the shared RetailHeader navigation
         and active states for desktop/mobile. Replace the ad-hoc brown blog palette across
         list/detail/category/tag/search/author pages with the locked tokens from
         `design-system/b2c/MASTER.md` (#1B5C4A, #0F2F28, #C9A84C, #F6F1E8).
         Repair all user-visible mojibake and add a source scan against common corrupt sequences.
      4. Analytics root fix: replace read-modify-save counters in BlogExtrasService with one
         atomic PostgreSQL UPSERT/increment per allowlisted event. Validate UUID/event and a
         published article, initialize every counter, handle concurrent first events, define
         honest unique-view semantics, and rate-limit/abuse-protect the public endpoint.
         The tracker may fail silently for visitors but must emit observable diagnostics;
         admin must show load error+retry separately from a legitimate zero/empty dataset.
         Do not claim that a GSC verification token is GSC analytics integration.
      5. Media deletion: wire the existing DELETE API into AdminBlogTools with confirmation,
         loading/error states and accessible controls. Before physical deletion, detect every
         cover/OG/Twitter/body reference and return 409 with usages unless a deliberate safe
         replacement workflow is used. A storage deletion failure must not delete DB metadata;
         missing-object retry must be idempotent. Enforce RBAC and audit destructive actions.

      ADMIN RMA AND REPORTS
      6. Reproduce `/v1/rma` and `/v1/dashboard/reports` with an authenticated admin request;
         capture status, correlation ID, safe API log, executed migrations, and information_schema
         evidence before changing code. Never guess the production error or enable DB_SYNC.
      7. RMA: if confirmed missing, add an idempotent timestamped TypeORM migration for the full
         `return_requests` schema, deliberate FKs/delete rules, and indexes on status+createdAt,
         customerId and orderItemId. Ensure compiled migration JS is shipped. Refactor approval
         into one transaction with row lock/CAS, strict state machine, one-time processing marker,
         actor/audit record and affected-row validation. Prevent concurrent/replayed double wallet
         credit and double stock restore. Implement exchange as an atomic source restore + target
         decrement with availability validation, or expose it as a separate incomplete workflow;
         never silently mark it complete.
      8. Reports: reproduce and migrate confirmed missing columns/indexes through TypeORM. Define
         one canonical wholesale/retail customer classification, backfill ambiguous/null legacy
         records, and reuse it in registration, admin filters, and reports. Replace sequential
         period loops and top-product N+1 queries with grouped/conditional aggregates; add indexes
         only after query-plan evidence. Return safe actionable admin errors with HTTP status and
         request ID, never SQL or secrets.

      PRODUCT PRICING
      9. Treat `wholesalePrice` and `retailPrice` as final/after-discount transaction prices.
         Add nullable `wholesaleCompareAtPrice` and properly promote the existing incomplete
         `retailCompareAtPrice` through TypeORM migration, entity, DTO validation, service
         create/update, shared types, admin create/edit, API responses and both storefronts.
         Label fields explicitly in Persian as before/after discount per channel. Convert blank
         to null; accept finite non-negative integer IRR values; when compare-at is present it
         must be greater than final. Compute strike-through and percentage from this invariant.
         Cards/PDP show both prices consistently; carts, orders, invoices and Torob feeds use
         final price only. Existing products with null compare-at remain backward compatible.
         Verify Rial/Toman boundaries and avoid unsafe JavaScript Number precision.

      TOROB / RETAIL PRODUCT URLS
      10. The reported live redirect loop was not reproduced on the current sample, so do not
          invent a redirect fix. The confirmed defect is feed/canonical inconsistency: a feed URL
          using `product.slug` can be 200 while `seoMeta.retailCanonical` points to a soft-404,
          noindex page. Create one `publicProductPath` invariant used by retail PDP canonical,
          sitemap and Torob feed. Prefer the actual resolvable `product.slug`; accept a custom
          canonical only when same-origin, `/products/<slug>`, and proven to resolve the same
          product as 200/indexable/self-canonical. Otherwise fall back and emit structured warning.
          If a prettier slug is required, transactionally migrate the product slug with uniqueness
          validation and exactly one old-slug 308 to the final 200 target.
      11. Normalize RETAIL_ORIGIN with a URL parser to HTTPS `www.poshaktaranom.ir` and remove
          accidental path/query components. Torob feed must publish direct final URLs only.
          Test all feed items, not a sample, with a TorobBot user agent: zero redirects, 200,
          indexable and self-canonical. Test HTTP/www/apex/trailing-slash host matrix separately.
          Record an Owner Action to refresh the Torob panel from the direct feed endpoint and
          replace stale/apex product URLs; Cursor must not claim this external action completed
          without owner evidence.

      DOCUMENTATION AND CLOSURE
      12. Update BLOG_TEST_REPORT, WORKLOG, readiness/progress/status and handoff with exact
          commands, exits, fixtures, screenshots, correlation IDs and redacted evidence. Keep
