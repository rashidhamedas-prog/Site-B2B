schema_version: 1
ai_dos_version: "2.0.0"
project:
  name: "taranom-platform"
  type: "monorepo-commerce"
  primary_branch: "master"
roles:
  high_risk_requires_independent_reviewer: true
  high_risk_requires_security_review: true
concurrency:
  task_registry: ".ai-dos/tasks/active.yaml"
  handoff_log: ".ai-dos/tasks/handoff.md"
  one_writer_per_file: true
  stale_claim_hours: 24
git:
  branch_pattern: "^(ai|feat|fix|chore)/[A-Za-z0-9._-]+$"
  worktree_per_task: true
  direct_commit_to_primary: false
context:
  soft_limit_percent: 65
  checkpoint_percent: 75
  new_session_percent: 85
  load_order:
    - "AGENTS.md"
    - ".ai-dos/project/status.md"
    - ".ai-dos/tasks/active.yaml"
    - ".ai-dos/tasks/handoff.md"
quality_gates:
  required:
    - "format"
    - "lint"
    - "typecheck"
    - "unit_test"
    - "integration_test_when_affected"
    - "build"
    - "review"
  commands:
    # Verified from package.json + .github/workflows/ci.yml (2026-08-09). Results NOT RUN in preflight.
    format: "npm run format"
    lint: "npm run lint"
    typecheck: "npx tsc --noEmit -w @taranom/web; npx tsc --noEmit -w @taranom/api  # or: cd apps/web && npx tsc --noEmit; cd apps/api && npx tsc --noEmit"
    unit_test: "npm run test  # turbo; also CI: npx ts-node --transpile-only src/modules/auth/auth.otp.logic.spec.ts (cwd apps/api)"
    integration_test: "bash scripts/e2e-purchase-test.sh  # requires local/staging API; NEVER real production money"
    build: "npm run build  # turbo; CI also builds apps/web and apps/api separately"
security:
  review_triggers:
    - "authentication_or_authorization"
    - "secrets_or_cryptography"
    - "payments_or_personal_data"
    - "network_or_file_input"
    - "dependency_or_ci_change"
    - "database_migration"
  secret_scan_command: "git grep -nE '(API_KEY|SECRET|PASSWORD|PRIVATE_KEY)\\s*=\\s*[^$]' -- ':!.env.example' ':!*.md' || true"
