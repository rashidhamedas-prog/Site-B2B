name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ts-node resolves @taranom/shared-types via exports.require → dist/index.js.
      # dist is gitignored, so the API suite dies at the first import unless we compile it.
      - name: Build shared-types
        run: npm run build -w @taranom/shared-types

      - name: Auth + payment unit suite
        run: npm test
        working-directory: apps/api

      - name: Web unit suite (product-transition)
        run: npx --yes tsx src/components/motion/product-transition.spec.ts && npx --yes tsx src/components/admin/sms/template-vars.spec.ts && npx --yes tsx src/components/admin/sms/sms-nav.spec.ts
        working-directory: apps/web

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Type check web
        run: npx tsc --noEmit
        working-directory: apps/web

      - name: Type check API
        run: npx tsc --noEmit
        working-directory: apps/api

      - name: Build web
        run: npm run build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://api.poshaktaranom.com
          API_INTERNAL_URL: https://poshaktaranom.com/api/v1

      - name: Build API
        run: npm run build
        working-directory: apps/api

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium webkit

      - name: Start Next and run product-card e2e
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_MOCK_API_PORT: "4010"
          E2E_MOCK_API_URL: http://127.0.0.1:4010/v1
          # Runtime server reads API_INTERNAL_URL. NEXT_PUBLIC_API_URL is inlined
          # at build (https://api.poshaktaranom.com); the spec tripwire mocks that
          # host and fails if any other request reaches poshaktaranom.com.
          API_INTERNAL_URL: http://127.0.0.1:4010/v1
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4010/v1
        run: |
          set -euo pipefail
          mock_pid=""
          pid=""
          cleanup() {
            if [ -n "${pid}" ]; then kill "$pid" 2>/dev/null || true; fi
            if [ -n "${mock_pid}" ]; then kill "$mock_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          node e2e/mock-api-server.cjs &
          mock_pid=$!
          for i in $(seq 1 50); do
            if curl -sf "http://127.0.0.1:4010/health" >/dev/null; then
              break
            fi
            sleep 0.1
          done
          curl -sf "http://127.0.0.1:4010/health" >/dev/null
          # output:standalone — `next start` is unsupported; match Docker runner.
          STANDALONE_WEB=".next/standalone/apps/web"
          mkdir -p "$STANDALONE_WEB/.next"
          rm -rf "$STANDALONE_WEB/.next/static" "$STANDALONE_WEB/public"
          cp -a .next/static "$STANDALONE_WEB/.next/static"
          cp -a public "$STANDALONE_WEB/public"
          test -f "$STANDALONE_WEB/server.js"
          # /products is force-static and was prerendered against production.
          # Drop that HTML so this server renders the fixture catalog.
          node e2e/purge-product-prerender.cjs
          PORT=3000 HOSTNAME=127.0.0.1 \
            NODE_OPTIONS="--require ${PWD}/e2e/block-production-hosts.cjs" \
            node "$STANDALONE_WEB/server.js" &
          pid=$!
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:3000/products" | grep -q 'e2e-linen-blouse'; then
              break
            fi
            sleep 2
          done
          curl -sf "http://127.0.0.1:3000/products" | grep -q 'e2e-linen-blouse'
          curl -sf "http://127.0.0.1:3000/icon-192.png" >/dev/null
          curl -sf "http://127.0.0.1:3000/icon-512.png" >/dev/null
          if ! grep -Eq '[[:space:]]localhost\.ir([[:space:]]|$)' /etc/hosts; then
            echo '127.0.0.1 localhost.ir' | sudo tee -a /etc/hosts >/dev/null
          fi
          npx playwright test -c e2e/playwright.product-card.config.ts

  omnichannel-migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty-DB omnichannel migrations up/down/up
        run: bash scripts/omnichannel-migrations-disposable-updown.sh

  deploy-lock-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Shellcheck deploy-lock scripts
        run: shellcheck -x scripts/lib/deploy-lock.sh scripts/tests/deploy-lock.test.sh
      - name: Deploy lock unit tests (no Docker)
        run: bash scripts/tests/deploy-lock.test.sh

  # Manual deploy only. Requires /opt/taranom/deploy-approval.json on the VPS
  # for the exact origin/master SHA + goRef. TARANOM_DEPLOY_FORCE does not bypass
  # that gate. Recommend GitHub Environment "production" required reviewers
  # (configure in repo Settings → Environments; not applied by this workflow file).
  deploy:
    needs: [lint-and-build, omnichannel-migrate, deploy-lock-tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Iran VPS (sole production origin; approval file required)
        uses: appleboy/ssh-action@v1.2.0
        with:
          # Sole Iran origin defaults. Override via repo secrets if the host changes.
          # Only VPS_SSH_KEY must be set; host/user/port should match Iran.
          host: ${{ secrets.VPS_HOST || '185.213.167.61' }}
          username: ${{ secrets.VPS_USER || 'tnadmin' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 3031 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/taranom
            # FORCE rebuilds when HEAD already matches origin/master; it does NOT
            # skip deploy-approval.json (asserted inside scripts/auto-deploy.sh).
            export TARANOM_DEPLOY_FORCE=1
            bash scripts/auto-deploy.sh
