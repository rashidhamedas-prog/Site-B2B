name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Auth + payment unit suite
        run: npm test
        working-directory: apps/api

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Type check web
        run: npx tsc --noEmit
        working-directory: apps/web

      - name: Type check API
        run: npx tsc --noEmit
        working-directory: apps/api

      - name: Build web
        run: npm run build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://api.poshaktaranom.com

      - name: Build API
        run: npm run build
        working-directory: apps/api

  omnichannel-migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty-DB omnichannel migrations up/down/up
        run: bash scripts/omnichannel-migrations-disposable-updown.sh

  deploy:
    needs: [lint-and-build, omnichannel-migrate]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Hetzner VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          # Host and user are the already-documented public values; override via
          # repo secrets if the server changes. Only VPS_SSH_KEY must be set.
          host: ${{ secrets.VPS_HOST || '5.75.200.102' }}
          username: ${{ secrets.VPS_USER || 'wholesale-admin' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 2222 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /opt/taranom
            export TARANOM_DEPLOY_FORCE=1
            bash scripts/auto-deploy.sh
